<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火瞳 · 后厨助理</title>
<link rel="stylesheet" href="assets/edge-ui.css">
<style>
  .kitchen-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: linear-gradient(135deg, #7c2d12 0%, #9a3412 50%, #c2410c 100%);
    color: #fff; border-radius: 12px; margin-bottom: 20px;
  }
  .kitchen-header h1 { margin: 0; font-size: 22px; }
  .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* IoT Card */
  .iot-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .iot-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .iot-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .iot-item { text-align: center; padding: 12px 8px; border-radius: 8px;
    background: #f9fafb; border: 1px solid #e5e7eb; transition: all 0.2s; }
  .iot-item.normal { border-color: #86efac; background: #f0fdf4; }
  .iot-item.warning { border-color: #fcd34d; background: #fefce8; }
  .iot-item.critical { border-color: #fca5a5; background: #fef2f2; }
  .iot-name { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .iot-value { font-size: 22px; font-weight: 700; color: #111827; }
  .iot-status { font-size: 11px; margin-top: 4px; padding: 2px 8px; border-radius: 8px; display: inline-block; }
  .status-ok { background: #dcfce7; color: #166534; }
  .status-warn { background: #fef3c7; color: #92400e; }

  /* Alert Panel */
  .alert-panel { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .alert-list { list-style: none; padding: 0; margin: 0; }
  .alert-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0;
    border-bottom: 1px solid #f3f4f6; font-size: 13px; }
  .alert-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .alert-level-info { color: #3b82f6; } .alert-level-warn { color: #f59e0b; } .alert-level-err { color: #ef4444; }

  /* Main Grid */
  .kitchen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* Prep List */
  .prep-table { width: 100%; border-collapse: collapse; }
  .prep-table th { text-align: left; padding: 8px 10px; font-size: 12px; color: #6b7280;
    border-bottom: 2px solid #f3f4f6; font-weight: 600; }
  .prep-table td { padding: 10px; border-bottom: 1px solid #f9fafb; font-size: 13px; }
  .prep-status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 10px; border-radius: 12px; }
  .status-done { background: #dcfce7; color: #166534; }
  .status-partial { background: #fef3c7; color: #92400e; }
  .status-todo { background: #fee2e2; color: #991b1b; }
  .progress-bar { width: 80px; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .fill-done { background: #10b981; } .fill-partial { background: #f59e0b; } .fill-todo { background: #ef4444; }

  /* Waste Timeline */
  .waste-timeline { position: relative; padding-left: 20px; }
  .waste-timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0;
    width: 2px; background: #fecaca; }
  .waste-event { position: relative; margin-bottom: 16px; }
  .waste-event::before { content: ''; position: absolute; left: -17px; top: 4px;
    width: 10px; height: 10px; border-radius: 50%; background: #ef4444; border: 2px solid #fff; }
  .waste-time { font-size: 11px; color: #9ca3af; }
  .waste-desc { font-size: 13px; color: #374151; }
  .waste-reason { font-size: 12px; color: #f59e0b; }

  .btn-action { padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer;
    border: none; background: #ea580c; color: #fff; margin-top: 12px; transition: all 0.2s; }
  .btn-action:hover { background: #c2410c; }

  @media (max-width: 768px) {
    .top-row, .kitchen-grid { grid-template-columns: 1fr; }
    .iot-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body class="edge-ui-body">

<div class="app-container">
  <div class="kitchen-header">
    <h1>&#128161; 火瞳 · 后厨助理</h1>
    <div style="display:flex;gap:12px;align-items:center;">
      <span style="font-size:14px;">潘厨</span>
      <select class="role-selector" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
        color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;" onchange="location.href=this.value">
        <option value="dashboard.html">店长工作台</option>
        <option value="kitchen-assistant.html" selected>后厨助理</option>
        <option value="purchase-assistant.html">采购助理</option>
      </select>
    </div>
  </div>

  <!-- IoT + Alerts -->
  <div class="top-row">
    <div class="iot-card">
      <div class="iot-title">&#127777; 冷柜温度状态</div>
      <div class="iot-grid" id="iotGrid"></div>
    </div>
    <div class="alert-panel">
      <div class="iot-title">&#9888; 今日告警 <span id="alertCount" style="color:#ef4444;font-weight:700"></span></div>
      <ul class="alert-list" id="alertList"></ul>
    </div>
  </div>

  <!-- Prep + Waste -->
  <div class="kitchen-grid">
    <div class="panel">
      <div class="panel-title">&#128230; 今日备货清单
        <span id="prepSummary" style="font-size:12px;color:#6b7280;font-weight:400;margin-left:8px;"></span>
      </div>
      <table class="prep-table" id="prepTable">
        <thead><tr><th>品项</th><th>已备/目标</th><th>进度</th><th>状态</th></tr></thead>
        <tbody></tbody>
      </table>
      <button class="btn-action" onclick="location.href='purchase-order.html'">&#128230; 一键生成补货单</button>
    </div>

    <div class="panel">
      <div class="panel-title">&#128465; 废料事件时间线</div>
      <div class="waste-timeline" id="wasteTimeline">
        <div class="empty-state"><div style="color:#d1d5db;">暂无废料记录</div></div>
      </div>
    </div>
  </div>

  <!-- SOP Reminders -->
  <div class="panel" style="margin-bottom:60px;">
    <div class="panel-title">&#128214; SOP 提醒</div>
    <div id="sopAlerts"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html">&#127968; 工作台</a>
  <a href="products.html">&#128230; 商品</a>
  <a href="receiving.html">&#128269; 收货</a>
  <a href="purchase-order.html">&#128722; 订单</a>
  <a href="supplier.html">&#128101; 供应商</a>
</nav>

<script src="assets/assistant.js"></script>
</body>
</html>
