<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火瞳 · 供应商协同</title>
<link rel="stylesheet" href="assets/edge-ui.css">
<style>
  .supplier-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: linear-gradient(135deg, #065f46 0%, #059669 50%, #10b981 100%);
    color: #fff; border-radius: 12px; margin-bottom: 20px;
  }
  .supplier-header h1 { margin: 0; font-size: 22px; }

  .sp-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
  .sp-card { background: #fff; border-radius: 12px; padding: 18px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid #10b981; }
  .sp-card-value { font-size: 28px; font-weight: 700; color: #111827; }
  .sp-card-label { font-size: 13px; color: #6b7280; margin-top: 4px; }
  .sp-card-change { font-size: 12px; margin-top: 6px; }
  .change-pos { color: #10b981; } .change-neg { color: #ef4444; }

  .sp-main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  .pending-order { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    border: 1px solid #a7f3d0; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .po-new-tag { background: #10b981; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 8px; }
  .po-items { font-size: 13px; color: #374151; margin: 8px 0; }
  .po-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-sp { padding: 7px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-confirm { background: #059669; color: #fff; } .btn-confirm:hover { background: #047857; }
  .btn-negotiate { background: #e5e7eb; color: #374151; } .btn-negotiate:hover { background: #d1d5db; }

  .quality-summary { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .qs-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
  .qs-bar { height: 24px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .qs-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #10b981, #34d399);
    display: flex; align-items: center; padding-left: 10px; font-size: 12px; color: #fff; font-weight: 600; }

  .issue-list { list-style: none; padding: 0; margin: 12px 0 0 0; }
  .issue-item { display: flex; align-items: center; gap: 8px; padding: 8px 0;
    border-bottom: 1px solid #f3f4f6; font-size: 13px; color: #b45309; }

  @media (max-width: 768px) {
    .sp-grid { grid-template-columns: repeat(2, 1fr); }
    .sp-main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="edge-ui-body">

<div class="app-container">
  <div class="supplier-header">
    <h1>&#129309; 火瞳 · 供应商协同</h1>
    <div style="display:flex;gap:12px;align-items:center;">
      <span style="font-size:14px;">王总 · 杭州冻品供应链</span>
      <select class="role-selector" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
        color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;" onchange="location.href=this.value">
        <option value="dashboard.html">店长工作台</option>
        <option value="supplier-portal.html" selected>供应商端</option>
      </select>
    </div>
  </div>

  <!-- KPI Cards -->
  <div class="sp-grid" id="spKpiGrid"></div>

  <div class="sp-main">
    <!-- Pending Orders -->
    <div class="panel">
      <div class="panel-title">&#128721; 待处理</div>
      <div id="pendingOrders"></div>
    </div>

    <!-- Quality Summary -->
    <div class="quality-summary">
      <div class="panel-title">&#127919; 品质反馈汇总</div>
      <div id="qualitySummary"></div>
    </div>
  </div>

  <!-- Score History (simplified) -->
  <div class="panel" style="margin-bottom:60px;">
    <div class="panel-title">&#128200; 评分趋势</div>
    <div id="scoreHistory" style="padding:10px 0;">
      <div class="empty-state"><div style="color:#d1d5db;">暂无评分数据</div></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html">&#127968; 工作台</a>
  <a href="products.html">&#128230; 商品</a>
  <a href="receiving.html">&#128269; 收货</a>
  <a href="purchase-order.html">&#128722; 订单</a>
  <a href="supplier.html">&#128101; 供应商</a>
</nav>

<script src="assets/assistant.js"></script>
</body>
</html>
