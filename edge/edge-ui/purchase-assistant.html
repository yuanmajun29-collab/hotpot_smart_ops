<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火瞳 · 采购助理</title>
<link rel="stylesheet" href="assets/edge-ui.css">
<style>
  .purchase-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #3b82f6 100%);
    color: #fff; border-radius: 12px; margin-bottom: 20px;
  }
  .purchase-header h1 { margin: 0; font-size: 22px; }

  .purchase-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* Suggestion Card */
  .po-sug-card { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    border: 1px solid #93c5fd; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .po-sug-title { font-size: 14px; font-weight: 600; color: #1e40af; display: flex; justify-content: space-between; }
  .po-sug-body { font-size: 13px; color: #334155; margin: 6px 0; white-space: pre-line; }
  .po-sug-actions { display: flex; gap: 8px; }
  .btn-po { padding: 5px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-create { background: #2563eb; color: #fff; } .btn-create:hover { background: #1d4ed8; }
  .btn-compare { background: #e0e7ff; color: #3730a3; } .btn-compare:hover { background: #c7d2fe; }

  /* PO Tracking */
  .po-track-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #f3f4f6;
    border-radius: 8px; margin-bottom: 8px; background: #fafafa; transition: all 0.2s; }
  .po-track-item:hover { background: #f9fafb; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
  .po-status-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; flex-shrink: 0; }
  .st-received { background: #10b981; } .st-partial { background: #f59e0b; }
  .st-confirmed { background: #3b82f6; } .st-pending { background: #9ca3af; }
  .po-info { flex: 1; min-width: 0; }
  .po-no { font-size: 13px; font-weight: 600; color: #111827; }
  .po-detail { font-size: 11px; color: #9ca3af; }
  .pct-bar { width: 60px; height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
  .pct-fill { height: 100%; border-radius: 3px; background: #3b82f6; }

  /* Supplier Comparison Table */
  .comp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .comp-table th { text-align: left; padding: 8px 10px; font-size: 11px; color: #6b7280;
    border-bottom: 2px solid #f3f4f6; text-transform: uppercase; }
  .comp-table td { padding: 10px; border-bottom: 1px solid #f9fafb; }
  .grade-badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .g-A { background: #dcfce7; color: #166534; } .g-B { background: #fef3c7; color: #92400e; }
  .g-C { background: #fee2e2; color: #991b1b; } .g-D { background: #fecaca; color: #991b1b; }
  .rec-tag { background: #10b981; color: #fff; padding: 2px 8px; border-radius: 8px; font-size: 11px; }
  .warn-tag { background: #f59e0b; color: #fff; padding: 2px 8px; border-radius: 8px; font-size: 11px; }

  @media (max-width: 768px) { .purchase-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body class="edge-ui-body">

<div class="app-container">
  <div class="purchase-header">
    <h1>&#128230; 火瞳 · 采购助理</h1>
    <select class="role-selector" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);
      color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;" onchange="location.href=this.value">
      <option value="dashboard.html">店长工作台</option>
      <option value="kitchen-assistant.html">后厨助理</option>
      <option value="purchase-assistant.html" selected>采购助理</option>
    </select>
  </div>

  <!-- KPI Row -->
  <div class="kpi-row" id="kpiRow"></div>

  <div class="purchase-grid">
    <!-- AI Purchase Suggestions -->
    <div class="panel">
      <div class="panel-title">&#129302; AI 采购建议</div>
      <div id="poSuggestions"></div>
    </div>

    <!-- PO Tracking -->
    <div class="panel">
      <div class="panel-title">&#128722; 订单跟踪</div>
      <div id="poTracking"></div>
    </div>
  </div>

  <!-- Supplier Comparison -->
  <div class="panel" style="margin-bottom:60px;">
    <div class="panel-title">&#128101; 供应商比价表</div>
    <div style="overflow-x:auto;">
      <table class="comp-table" id="compTable">
        <thead><tr><th>供应商</th><th>均价</th><th>评级</th><th>交期</th><th>准时率</th><th>品质分</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html">&#127968; 工作台</a>
  <a href="products.html">&#128230; 商品</a>
  <a href="receiving.html">&#128269; 收货</a>
  <a href="purchase-order.html">&#128722; 订单</a>
  <a href="supplier.html">&#128101; 供应商</a>
</nav>

<script src="assets/assistant.js"></script>
</body>
</html>
