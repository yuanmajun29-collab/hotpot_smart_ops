<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火瞳 · 店长工作台 - AI数字座舱</title>
<link rel="stylesheet" href="assets/edge-ui.css">
<style>
  /* ===== A01 Dashboard Styles ===== */
  .dashboard-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 24px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff; border-radius: 12px; margin-bottom: 20px;
  }
  .dashboard-header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; }
  .dashboard-header .fire-icon { font-size: 26px; }
  .header-right { display: flex; gap: 16px; align-items: center; }
  .role-selector { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
  .date-badge { background: rgba(255,255,255,0.12); padding: 5px 14px; border-radius: 16px; font-size: 13px; }

  /* KPI Cards */
  .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border-left: 4px solid #4f46e5; transition: transform 0.2s; position: relative; overflow: hidden; }
  .kpi-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  .kpi-card.warning { border-left-color: #f59e0b; }
  .kpi-card.critical { border-left-color: #ef4444; }
  .kpi-label { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .kpi-value { font-size: 28px; font-weight: 700; color: #111827; line-height: 1.2; }
  .kpi-unit { font-size: 14px; color: #6b7280; font-weight: 400; margin-left: 2px; }
  .kpi-change { font-size: 12px; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
  .change-up { color: #10b981; } .change-down { color: #10b981; } .change-stable { color: #6b7280; }

  /* Main Grid */
  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }

  /* Task List */
  .panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .task-list { list-style: none; padding: 0; margin: 0; }
  .task-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f3f4f6;
    transition: background 0.15s; }
  .task-item:last-child { border-bottom: none; }
  .task-item:hover { background: #f9fafb; margin: 0 -12px; padding: 12px; border-radius: 8px; }
  .priority-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 12px; flex-shrink: 0; }
  .p-urgent { background: #ef4444; } .p-high { background: #f59e0b; }
  .p-medium { background: #3b82f6; } .p-low { background: #10b981; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 14px; font-weight: 500; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-desc { font-size: 12px; color: #9ca3af; margin-top: 2px; }
  .task-action { margin-left: 12px; }
  .btn-task { padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer;
    border: 1px solid #4f46e5; background: #fff; color: #4f46e5; transition: all 0.2s; text-decoration: none; }
  .btn-task:hover { background: #4f46e5; color: #fff; }
  .btn-task.urgent { border-color: #ef4444; color: #ef4444; }
  .btn-task.urgent:hover { background: #ef4444; color: #fff; }

  /* Suggestion Cards */
  .sug-list { display: flex; flex-direction: column; gap: 12px; }
  .sug-card { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border: 1px solid #bae6fd;
    border-radius: 10px; padding: 14px 16px; transition: all 0.2s; }
  .sug-card:hover { box-shadow: 0 4px 12px rgba(59,130,246,0.15); }
  .sug-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px; }
  .sug-title { font-size: 14px; font-weight: 600; color: #0369a1; }
  .sug-confidence { font-size: 11px; background: #3b82f6; color: #fff; padding: 2px 8px; border-radius: 10px; }
  .sug-content { font-size: 13px; color: #334155; line-height: 1.5; margin-bottom: 10px; white-space: pre-line; }
  .sug-actions { display: flex; gap: 8px; }
  .btn-sug { padding: 5px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-accept { background: #10b981; color: #fff; }
  .btn-accept:hover { background: #059669; }
  .btn-reject { background: #e5e7eb; color: #4b5563; }
  .btn-reject:hover { background: #d1d5db; }
  .btn-detail { background: #dbeafe; color: #2563eb; }
  .btn-detail:hover { background: #bfdbfe; }

  /* Trend Chart */
  .trend-panel { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .trend-row { display: flex; gap: 24px; margin-top: 16px; }
  .trend-item { flex: 1; }
  .trend-label { font-size: 13px; color: #6b7280; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .trend-bar-bg { height: 24px; background: #f3f4f6; border-radius: 4px; overflow: hidden; position: relative; }
  .trend-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; display: flex; align-items: center; padding-left: 8px;
    font-size: 11px; color: #fff; font-weight: 600; min-width: 40px; }
  .bar-green { background: linear-gradient(90deg, #10b981, #34d399); }
  .bar-blue { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
  .bar-orange { background: linear-gradient(90deg, #f59e0b, #fbbf24); color: #92400e; }
  .bar-red { background: linear-gradient(90deg, #ef4444, #f87171); }

  /* Empty State */
  .empty-state { text-align: center; padding: 32px; color: #9ca3af; }
  .empty-state .icon { font-size: 40px; margin-bottom: 8px; }

  /* Responsive */
  @media (max-width: 1024px) {
    .kpi-row { grid-template-columns: repeat(3, 1fr); }
    .main-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body class="edge-ui-body">

<div class="app-container">
  <!-- Header -->
  <div class="dashboard-header">
    <h1><span class="fire-icon">&#128293;</span> 火瞳 · 店长工作台</h1>
    <div class="header-right">
      <span style="font-size:14px;">椒江店</span>
      <select class="role-selector" id="roleSwitch" onchange="switchRole(this.value)">
        <option value="store_manager">店长视角</option>
        <option value="chef_head">后厨助理</option>
        <option value="purchaser">采购助理</option>
        <option value="supplier">供应商端</option>
      </select>
      <span class="date-badge" id="dateDisplay"></span>
    </div>
  </div>

  <!-- KPI Row -->
  <div class="kpi-row" id="kpiRow">
    <div class="kpi-card"><div class="kpi-label">加载中...</div></div>
  </div>

  <!-- Main Content -->
  <div class="main-grid">
    <!-- Tasks Panel -->
    <div class="panel">
      <div class="panel-title">&#128203; 今日待办 <span id="taskCount" style="color:#4f46e5;font-weight:700"></span></div>
      <ul class="task-list" id="taskList">
        <li class="empty-state"><div class="icon">&#8987;</div>加载中...</li>
      </ul>
    </div>

    <!-- Suggestions Panel -->
    <div class="panel">
      <div class="panel-title">&#128161; AI 智能建议</div>
      <div class="sug-list" id="sugList">
        <div class="empty-state"><div class="icon">&#129302;</div>加载中...</div>
      </div>
    </div>
  </div>

  <!-- Trend Charts -->
  <div class="trend-panel">
    <div class="panel-title">&#128200; 经营趋势 (近7日)</div>
    <div class="trend-row" id="trendRow"></div>
  </div>
</div>

<!-- Navigation (bottom bar) -->
<nav class="bottom-nav">

</body>
</html>
