<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火瞳 Edge UI - 登录</title>
  <link rel="stylesheet" href="assets/edge-ui.css">
  <style>
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--color-background-tertiary);
    }
    .login-card {
      background: var(--color-background-primary);
      border: 0.5px solid var(--color-border-tertiary);
      border-radius: var(--border-radius-lg);
      padding: 2.5rem;
      width: 380px;
      text-align: center;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, #E24B4A, #D85A30);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
    }
    .login-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--color-text-primary);
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 1.75rem;
    }

    /* ── 选项卡切换 ── */
    .tab-container {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      background: var(--color-background-secondary);
      border-radius: 10px;
      padding: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      color: var(--color-text-secondary);
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #378ADD;
      color: #fff;
      box-shadow: 0 2px 8px rgba(55, 138, 221, 0.25);
    }
    .tab-btn:hover:not(.active) {
      color: var(--color-text-primary);
      background: rgba(55, 138, 221, 0.08);
    }

    /* ── JWT 登录表单 ── */
    .jwt-form { display: none; }
    .jwt-form.active { display: block; }
    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-text-secondary);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--color-border-secondary);
      border-radius: 10px;
      font-size: 14px;
      color: var(--color-text-primary);
      background: var(--color-background-secondary);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
      box-sizing: border-box;
    }
    .form-input:focus {
      border-color: #378ADD;
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.12);
    }
    .form-input::placeholder {
      color: var(--color-text-tertiary);
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      font-size: 12px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--color-text-secondary);
      cursor: pointer;
    }
    .remember-me input[type="checkbox"] {
      accent-color: #378ADD;
    }
    .forgot-link {
      color: #378ADD;
      text-decoration: none;
      cursor: pointer;
    }
    .forgot-link:hover { text-decoration: underline; }

    /* ── PIN 输入组件 (降级) ── */
    .pin-form { display: none; }
    .pin-form.active { display: block; }
    .pin-input-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 1rem;
    }
    .pin-digit {
      width: 44px;
      height: 52px;
      border: 1.5px solid var(--color-border-secondary);
      border-radius: 10px;
      font-size: 22px;
      font-weight: 500;
      text-align: center;
      color: var(--color-text-primary);
      background: var(--color-background-secondary);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .pin-digit:focus {
      border-color: #378ADD;
      box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.15);
    }
    .pin-digit.filled {
      border-color: #378ADD;
      background: #E6F1FB;
    }
    .pin-hint {
      font-size: 12px;
      color: var(--color-text-tertiary);
      margin-bottom: 1.25rem;
    }
    /* 隐藏的真实输入框 */
    .hidden-pin-input {
      position: absolute;
      left: -9999px;
      opacity: 0;
    }

    /* ── 通用按钮 ── */
    .btn-login {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      background: #378ADD;
      color: #fff;
    }
    .btn-login:hover { background: #185FA5; }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-login.btn-setup { background: #639922; }
    .btn-login.btn-setup:hover { background: #3B6D11; }

    .error-msg {
      color: var(--color-text-danger, #E24B4A);
      font-size: 12px;
      margin-top: 12px;
      min-height: 18px;
    }

    /* ── PIN 降级提示 ── */
    .pin-degrade-notice {
      margin-top: 1rem;
      padding: 10px 14px;
      background: #FFF8E6;
      border: 0.5px solid #FFE58F;
      border-radius: 8px;
      font-size: 12px;
      color: #856404;
      text-align: left;
      line-height: 1.5;
    }
    .pin-degrade-notice strong {
      color: #D85A30;
    }

    /* ── 新用户引导弹窗 ── */
    .upgrade-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .upgrade-modal.show { display: flex; }
    .upgrade-modal-content {
      background: var(--color-background-primary);
      border-radius: 14px;
      padding: 2rem;
      width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .upgrade-modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 0.75rem;
    }
    .upgrade-modal-desc {
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .upgrade-modal-actions {
      display: flex;
      gap: 10px;
    }
    .btn-upgrade-modal {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-upgrade-primary {
      background: #378ADD;
      color: #fff;
    }
    .btn-upgrade-primary:hover { background: #185FA5; }
    .btn-upgrade-secondary {
      background: var(--color-background-secondary);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border-secondary);
    }
    .btn-upgrade-secondary:hover { background: var(--color-border-secondary); }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">火瞳</div>
      <div class="login-title">边缘盒子控制台</div>
      <div class="login-subtitle">冯校长火锅连锁 · AI运营中台</div>

      <!-- 选项卡切换 -->
      <div class="tab-container">
        <button class="tab-btn active" data-tab="jwt" id="tabJwt">账号密码</button>
        <button class="tab-btn" data-tab="pin" id="tabPin">PIN码</button>
      </div>

      <!-- JWT 登录表单 (默认显示) -->
      <div class="jwt-form active" id="jwtForm">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-input" id="jwtUsername" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input type="password" class="form-input" id="jwtPassword" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>记住登录状态</span>
          </label>
          <a class="forgot-link" onclick="alert('请联系店长重置密码')">忘记密码?</a>
        </div>
        <button class="btn-login" id="jwtSubmitBtn">登 录</button>
      </div>

      <!-- PIN 登录表单 (降级方案) -->
      <div class="pin-form" id="pinForm">
        <!-- 隐藏的真实input -->
        <input type="text" id="realPinInput" class="hidden-pin-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off">

        <!-- 6位PIN显示框 -->
        <div class="pin-input-group" id="pinGroup">
          <input type="text" class="pin-digit" readonly tabindex="-1" data-index="0">
          <input type="text" class="pin-digit" readonly tabindex="-1" data-index="1">
          <input type="text" class="pin-digit" readonly tabindex="-1" data-index="2">
          <input type="text" class="pin-digit" readonly tabindex="-1" data-index="3">
          <input type="text" class="pin-digit" readonly tabindex="-1" data-index="4">
          <input type="text" class="pin-digit" readonly tabindex="-1" data-index="5">
        </div>

        <div class="pin-hint" id="pinHint">输入6位数字密码</div>
        <button class="btn-login" id="pinSubmitBtn" disabled>确认</button>

        <!-- PIN降级提示 -->
        <div class="pin-degrade-notice" id="pinDegradeNotice">
          <strong>⚠️ 建议升级:</strong> PIN码安全性较低，推荐使用<strong>账号密码</strong>登录以获得完整权限和多设备支持。
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <!-- 新用户引导弹窗 -->
  <div class="upgrade-modal" id="upgradeModal">
    <div class="upgrade-modal-content">
      <div class="upgrade-modal-title">🔐 升级到账号密码登录</div>
      <div class="upgrade-modal-desc">
        检测到您使用PIN码登录。<br><br>
        设置<strong>用户名+密码</strong>后，您可以：<br>
        • 在多台设备上同时登录<br>
        • 获得更高级别的数据权限<br>
        • 享受更安全的Token认证
      </div>
      <div class="upgrade-modal-actions">
        <button class="btn-upgrade-modal btn-upgrade-secondary" id="btnSkipUpgrade">稍后再说</button>
        <button class="btn-upgrade-modal btn-upgrade-primary" id="btnDoUpgrade">立即设置</button>
      </div>
    </div>
  </div>

  <script src="assets/auth_v2.js"></script>
</body>
</html>
