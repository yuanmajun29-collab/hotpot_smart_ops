services:
  hub:
    image: python:3.11-slim-bookworm
    working_dir: /app
    volumes:
      - ../..:/app
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq libgl1 libglib2.0-0 libpq-dev gcc >/dev/null
      && pip install -q -r requirements.txt
      && python hotpot_platform/cloud/event_hub/server.py --host 0.0.0.0 --port 8098 --seed-dir demo/data/stores"
    ports:
      - "8098:8098"
    environment:
      HOTPOT_AUTH_MODE: ${HOTPOT_AUTH_MODE:-demo}
      HOTPOT_DATABASE_URL: ${HOTPOT_DATABASE_URL:-}
      HOTPOT_JWT_SECRET: ${HOTPOT_JWT_SECRET:-}
      HOTPOT_CORS_ORIGINS: ${HOTPOT_CORS_ORIGINS:-}
      HOTPOT_EDGE_API_KEYS: ${HOTPOT_EDGE_API_KEYS:-}
      HOTPOT_WECHAT_WEBHOOK: ${HOTPOT_WECHAT_WEBHOOK:-}
      HOTPOT_WECHAT_WEBHOOK_STORE_YUHUAN: ${HOTPOT_WECHAT_WEBHOOK_STORE_YUHUAN:-}
      HOTPOT_WECHAT_WEBHOOK_STORE_JIAOJIANG: ${HOTPOT_WECHAT_WEBHOOK_STORE_JIAOJIANG:-}
      HOTPOT_PUSH_WARN: ${HOTPOT_PUSH_WARN:-0}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  dashboard:
    image: python:3.11-slim-bookworm
    working_dir: /app
    volumes:
      - ../..:/app
    command: python hotpot_platform/dashboard/serve.py --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
