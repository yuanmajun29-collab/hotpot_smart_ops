# ── 服务术语库 ────────────────────────────────────────────
service_terminology:
  greeting: "欢迎光临火瞳火锅！请问几位用餐？"
  seating: "这边请，您的位置在靠窗的位置，视野很好。"
  ordering: "推荐您试试我们的招牌毛肚和精品鸭肠，都是今日新鲜到货的。"
  upsell: "餐后来份冰粉吧？解辣又清爽，今天还有活动价。"
  handling_complaint: "非常抱歉给您带来不好的体验，我马上叫经理来处理，请您稍等。"
  farewell: "谢谢光临，慢走！下次再来记得提前预约留位哦。"

# ── 业务阈值 ──────────────────────────────────────────────
thresholds:
  # 废料管理
  waste_warning_kg: 15        # 废料预警阈值（kg）
  waste_critical_kg: 25       # 废料严重阈值（kg）

  # 温度监控
  freezer_temp_min_c: -18     # 冷库温度下限
  freezer_temp_max_c: -15     # 冷库温度上限
  fridge_temp_min_c: 2        # 冷藏柜温度下限
  fridge_temp_max_c: 8        # 冷藏柜温度上限
  kitchen_temp_min_c: 20      # 厨房环境温度下限
  kitchen_temp_max_c: 30      # 厨房环境温度上限

  # 服务质量
  response_time_target_sec: 180   # 响应时间目标（秒）
  table_cleaning_timeout_sec: 180 # 清台超时时间（秒）
  table_cleaning_urgent_sec: 60   # 紧急清台时间（秒）

  # 销售目标
  daily_revenue_target: 13000     # 日营业额目标（元）
  turnover_rate_target: 2.5       # 翻台率目标

# ── Agent 模拟模式配置 ─────────────────────────────────────
simulation:
  mode: "demo"                   # off=生产, demo=演示(有标记), expo=展会(无标记)
  seed: 42                       # 随机种子（None=不固定）
  auto_refresh_interval_sec: 300 # 数据刷新间隔（秒）

# ── 协作场景配置 ──────────────────────────────────────────
orchestration:
  waste_to_purchase:
    name: "废料转采购建议"
    timeout_sec: 30
    steps:
      - name: "analyze_waste"
        agent_type: "KitchenAgent"
        timeout_sec: 10
      - name: "generate_purchase_suggestion"
        agent_type: "ProcurementAgent"
        timeout_sec: 10
      - name: "notify_store_manager"
        agent_type: "StoreManagerAgent"
        timeout_sec: 10
