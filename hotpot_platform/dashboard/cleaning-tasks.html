<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#c62828" />
  <title>🔥 火瞳 · 清台任务</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #1a1a1a; --surface2: #242424;
      --text: #eee; --muted: #888; --accent: #e53935; --accent2: #ff5252;
      --ok: #43a047; --warn: #fb8c00; --border: #333; --radius: 12px;
      --brand-gold: #ffc107; --brand-orange: #ff6f00;
    }
    body {
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 430px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

    /* ===== Header — 火瞳品牌强视觉 ===== */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 40%, #8e0000 100%);
      padding: 18px 20px 16px; color: #fff;
      box-shadow: 0 4px 20px rgba(198,40,40,.35);
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .header-brand { display: flex; align-items: center; gap: 12px; }

    /* 🔥 火瞳 Logo Seal */
    .header-seal {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(145deg, rgba(255,215,0,.25) 0%, rgba(255,111,0,.2) 100%);
      border: 1.5px solid rgba(255,215,0,.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900;
      text-shadow: 0 1px 4px rgba(0,0,0,.5);
      box-shadow: 0 2px 10px rgba(255,111,0,.2), inset 0 1px 0 rgba(255,255,255,.15);
      position: relative;
      overflow: hidden;
    }
    .header-seal::after {
      content: '';
      position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255,215,0,.08), transparent, rgba(255,111,0,.06), transparent);
      animation: sealShine 4s linear infinite;
    }
    @keyframes sealShine { to { transform: rotate(360deg); } }
    .header-seal span {
      position: relative; z-index: 1;
      font-family: "STSong","Songti SC","Noto Serif SC",serif;
      letter-spacing: -1px;
    }

    /* 品牌名 */
    .header h1 {
      font-size: 19px; font-weight: 700; letter-spacing: 1.5px;
      background: linear-gradient(180deg, #fff 30%, rgba(255,215,0,.85) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-meta {
      font-size: 12px; opacity: .85; margin-top: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .header-meta .brand-tag {
      display: inline-block; padding: 1px 8px; border-radius: 10px;
      background: rgba(255,215,0,.2); color: var(--brand-gold);
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      border: 1px solid rgba(255,215,0,.25);
    }
    .header-stats { display: flex; gap: 16px; margin-top: 14px; }
    .h-stat { text-align: center; flex: 1; }
    .h-stat .num { font-size: 26px; font-weight: 800; line-height: 1.2; }
    .h-stat .lbl { font-size: 11px; opacity: .7; letter-spacing: 0.5px; }

    /* Filter bar */
    .filter-bar {
      display: flex; gap: 8px; padding: 12px 16px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .filter-bar button {
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
      transition: all .2s;
    }
    .filter-bar button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Task list */
    .task-list { flex: 1; padding: 12px 16px 100px; }
    .task-card {
      background: var(--surface); border-radius: var(--radius);
      border: 1px solid var(--border); padding: 16px; margin-bottom: 12px;
      transition: transform .15s, box-shadow .15s;
    }
    .task-card:active { transform: scale(.98); }
    .task-card.pending { border-left: 3px solid var(--warn); }
    .task-card.accepted { border-left: 3px solid var(--ok); }
    .task-card.overdue { border-left: 3px solid var(--accent); }

    .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .task-table-id {
      font-size: 18px; font-weight: 700; color: var(--accent2);
    }
    .task-status-badge {
      font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600;
    }
    .badge-pending { background: rgba(251,140,0,.15); color: var(--warn); }
    .badge-accepted { background: rgba(67,160,71,.15); color: var(--ok); }
    .badge-overdue { background: rgba(229,57,53,.15); color: var(--accent2); }

    .task-info { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 6px; }
    .task-info span { margin-right: 12px; }
    .task-time { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .task-time .elapsed { color: var(--warn); font-weight: 600; }
    .task-time .overdue-text { color: var(--accent2); font-weight: 600; }

    /* Action buttons */
    .task-actions { display: flex; gap: 8px; }
    .btn {
      flex: 1; padding: 10px 0; border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all .15s; text-align: center;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:active:not(:disabled) { background: var(--accent2); }
    .btn-success { background: var(--ok); color: #fff; }
    .btn-success:active:not(:disabled) { background: #388e3c; }
    .btn-outline {
      background: transparent; color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-outline:active:not(:disabled) { background: var(--surface2); }

    /* Correct sheet (bottom drawer) */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    }
    .overlay.show { display: block; }
    .sheet {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
      width: 100%; max-width: 430px;
      background: var(--surface); border-radius: 20px 20px 0 0;
      z-index: 201; transition: transform .3s ease;
      padding: 20px 20px 30px;
    }
    .sheet.show { transform: translateX(-50%) translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: var(--border); margin: 0 auto 16px;
    }
    .sheet h3 { font-size: 16px; margin-bottom: 16px; }
    .sheet-options { display: flex; flex-direction: column; gap: 10px; }
    .sheet-option {
      display: flex; align-items: center; gap: 12px; padding: 14px 16px;
      background: var(--surface2); border-radius: var(--radius);
      border: 2px solid transparent; cursor: pointer; font-size: 15px;
      transition: border-color .15s;
    }
    .sheet-option.selected { border-color: var(--accent); }
    .sheet-option .opt-icon { font-size: 22px; }
    .sheet-note {
      margin-top: 16px; padding: 12px; background: rgba(229,57,53,.08);
      border-radius: 8px; font-size: 12px; color: var(--warn); line-height: 1.6;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 14px; line-height: 1.6; }

    /* Toast */
    .toast {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
      background: var(--surface2); color: var(--text); padding: 10px 24px;
      border-radius: 24px; font-size: 13px; z-index: 300;
      opacity: 0; transition: all .25s; border: 1px solid var(--border);
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: var(--ok); color: var(--ok); }
    .toast.err { border-color: var(--accent); color: var(--accent2); }

    /* Loading spinner */
    .spinner {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .6s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Bottom nav hint */
    .bottom-hint {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 10px 20px; text-align: center; font-size: 12px; color: var(--muted);
      z-index: 90;
    }
    .bottom-hint a { color: var(--accent2); text-decoration: none; }
  </style>
</head>
<body>
<div class="app">
  <!-- Header — 🔥 火瞳品牌 -->
  <header class="header">
    <div class="header-top">
      <div class="header-brand">
        <div class="header-seal"><span>🔥瞳</span></div>
        <div>
          <h1>火瞳 · 清台任务</h1>
          <div class="header-meta">
            <span id="user-info">加载中...</span>
            <span class="brand-tag">AI VISION</span>
          </div>
        </div>
      </div>
      <a href="mobile/index.html" style="color:#fff;font-size:13px;text-decoration:none;opacity:.8;">← 首页</a>
    </div>
    <div class="header-stats">
      <div class="h-stat"><div class="num" id="stat-pending">-</div><div class="lbl">待接单</div></div>
      <div class="h-stat"><div class="num" id="stat-my">-</div><div class="lbl">我的任务</div></div>
      <div class="h-stat"><div class="num" id="stat-done">-</div><div class="lbl">今日完成</div></div>
    </div>
  </header>

  <!-- Filter -->
  <div class="filter-bar">
    <button class="active" data-status="pending">待接单</button>
    <button data-status="accepted,in_progress">进行中</button>
    <button data-status="">全部</button>
  </div>

  <!-- Task list -->
  <div class="task-list" id="task-list"></div>

  <!-- Bottom hint — 🔥 火瞳品牌 -->
  <div class="bottom-hint">
    <span style="color:var(--accent2);font-weight:700;">🔥 火瞳</span> 视觉AI自动检测 ·
    <span id="refresh-timer">5s</span> 后刷新 ·
    <a href="#" onclick="manualRefresh()">立即刷新</a>
  </div>
</div>

<!-- Correct state bottom sheet -->
<div class="overlay" id="correct-overlay" onclick="closeCorrectSheet()"></div>
<div class="sheet" id="correct-sheet">
  <div class="sheet-handle"></div>
  <h3>纠正桌态 — <span id="correct-table-id"></span></h3>
  <div class="sheet-options" id="correct-options">
    <div class="sheet-option" data-state="dining">
      <span class="opt-icon">🍽️</span><span>正在用餐（误报）</span>
    </div>
    <div class="sheet-option" data-state="empty">
      <span class="opt-icon">✅</span><span>已清理干净</span>
    </div>
    <div class="sheet-option" data-state="need_clean">
      <span class="opt-icon">🧹</span><span>确实需要清台</span>
    </div>
  </div>
  <div class="sheet-note">
    ⚠️ 纠正记录将写入审计日志，用于优化视觉识别模型。请如实选择。
  </div>
  <div style="margin-top:16px;display:flex;gap:8px;">
    <button class="btn btn-outline" onclick="closeCorrectSheet()" style="flex:1">取消</button>
    <button class="btn btn-primary" id="btn-submit-correct" onclick="submitCorrection()" style="flex:1">提交纠正</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="../assets/core.js"></script>
<script>
/** T3: Mobile H5 Cleaning Task Acceptance Page
 *
 * Features:
 *  - Real-time pending cleaning task list (auto-refresh 5s)
 *  - One-tap accept (接单) → submit (完成)
 *  - Table state correction (纠正) with audit trail
 *  - RBAC via Hub JWT auth
 */

const auth = HotpotApp.requireAuth();
if (!auth) { throw new Error("认证失败，请重新登录"); }

// ---- State ---------------------------------------------------------------
let allTasks = [];
let currentFilter = "pending";
let currentCorrectTask = null;
let selectedCorrectState = null;
let doneTodayCount = 0;

// ---- Init ----------------------------------------------------------------
document.getElementById("user-info").textContent =
  `${auth.name || auth.username} · ${auth.roleName || auth.role} · ${auth.storeName || "椒江店"}`;

// Filter buttons
document.querySelectorAll(".filter-bar button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-bar button").forEach(b => {
      b.classList.remove("active");
      b.classList.add("btn-outline");
    });
    btn.classList.add("active");
    btn.classList.remove("btn-outline");
    currentFilter = btn.dataset.status;
    renderTasks();
  };
});

// Correct options
document.querySelectorAll("#correct-options .sheet-option").forEach(opt => {
  opt.onclick = () => {
    document.querySelectorAll("#correct-options .sheet-option").forEach(o => o.classList.remove("selected"));
    opt.classList.add("selected");
    selectedCorrectState = opt.dataset.state;
  };
});

// ---- API helpers ---------------------------------------------------------

function getHubUrl() {
  return localStorage.getItem("hotpot_hub_url") || HotpotApp.hubUrl() || "";
}

function apiHeaders() {
  const token = localStorage.getItem("hotpot_token") || "";
  const h = { "Content-Type": "application/json" };
  if (token) h["Authorization"] = "Bearer " + token;
  return h;
}

async function apiGet(path) {
  const url = getHubUrl() + path;
  const res = await fetch(url, { headers: apiHeaders() });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  return res.json();
}

async function apiPost(path, body) {
  const url = getHubUrl() + path;
  const res = await fetch(url, {
    method: "POST",
    headers: apiHeaders(),
    body: JSON.stringify(body),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`API ${res.status}: ${errText}`);
  }
  return res.json();
}

// ---- Core logic ----------------------------------------------------------

async function fetchTasks() {
  try {
    const data = await apiGet("/v1/tasks?task_type=cleaning&limit=50");
    allTasks = data.tasks || [];
    updateStats();
    renderTasks();
    updateConnStatus(true);
  } catch (e) {
    console.warn("[T3] Fetch tasks failed:", e);
    updateConnStatus(false);
  }
}

function updateStats() {
  const pending = allTasks.filter(t => t.status === "pending").length;
  const myTasks = allTasks.filter(t =>
    t.status === "accepted" || t.status === "in_progress"
  ).length;
  document.getElementById("stat-pending").textContent = pending;
  document.getElementById("stat-my").textContent = myTasks;
  document.getElementById("stat-done").textContent = doneTodayCount;
}

function filterTasks() {
  if (!currentFilter) return allTasks;
  const statuses = currentFilter.split(",");
  return allTasks.filter(t => statuses.includes(t.status));
}

function getElapsedTime(createdAt) {
  if (!createdAt) return "";
  try {
    const created = new Date(createdAt);
    const now = new Date();
    const sec = Math.floor((now - created) / 1000);
    if (sec < 60) return `${sec}秒前`;
    if (sec < 3600) return `${Math.floor(sec / 60)}分钟前`;
    return `${Math.floor(sec / 3600)}小时前`;
  } catch { return ""; }
}

function isOverdue(task) {
  if (!task.created_at) return false;
  try {
    const created = new Date(task.created_at);
    const ageSec = (Date.now() - created.getTime()) / 1000;
    return ageSec > 180; // 3min threshold
  } catch { return false; }
}

function renderTasks() {
  const container = document.getElementById("task-list");
  const tasks = filterTasks();

  if (tasks.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">${currentFilter ? "🎉" : "🔥"}</div>
        <p style="margin-top:12px;">
          ${currentFilter === "pending"
            ? "<b>暂无待接单的清台任务</b><br/><span style='font-size:12px;color:var(--muted)'>🔥 火瞳视觉检测到待清台时会自动推送</span>"
            : currentFilter
              ? "该分类下暂无任务"
              : "<span style='color:var(--accent2);font-weight:600;'>🔥 火瞳</span> 暂无清台任务记录"}
        </p>
      </div>`;
    return;
  }

  container.innerHTML = tasks.map(task => {
    const overdue = isOverdue(task);
    const elapsed = getElapsedTime(task.created_at);
    const statusMap = {
      pending: { label: "待接单", cls: "badge-pending" },
      accepted: { label: "已接单", cls: "badge-accepted" },
      in_progress: { label: "进行中", cls: "badge-accepted" },
    };
    const st = statusMap[task.status] || { label: task.status, cls: "badge-pending" };
    const cardCls = overdue ? "task-card overdue" :
                     task.status === "pending" ? "task-card pending" : "task-card accepted";

    // Action buttons based on status
    let actionsHtml = "";
    if (task.status === "pending") {
      actionsHtml = `
        <button class="btn btn-primary" onclick="acceptTask('${task.task_id}', this)">接 单</button>
        <button class="btn btn-outline" onclick="openCorrectSheet('${task.task_id}', '${task.table_id || ""}')">纠 正</button>`;
    } else if (task.status === "accepted" || task.status === "in_progress") {
      actionsHtml = `
        <button class="btn btn-success" onclick="completeTask('${task.task_id}', this)">完 成</button>
        <button class="btn btn-outline" onclick="openCorrectSheet('${task.task_id}', '${task.table_id || "")')">纠 正</button>`;
    }

    return `
      <div class="${cardCls}" data-task-id="${task.task_id}">
        <div class="task-header">
          <span class="task-table-id">${task.table_id || task.title || "未知桌位"}</span>
          <span class="task-status-badge ${st.cls}">${st.label}</span>
        </div>
        <div class="task-info">
          <span>📍 ${task.table_id || "-"}</span>
          <span style="color:var(--accent2);">🔥 火瞳AI</span>
          ${task.assignee_name ? `<span>👤 ${task.assignee_name}</span>` : ""}
        </div>
        <div class="task-time">
          创建于 ${elapsed || "-"}
          ${overdue ? '<span class="overdue-text"> · 已超时!</span>' : ''}
          ${!overdue && task.status === "pending" ? '<span class="elapsed"> · 待处理</span>' : ''}
        </div>
        <div class="task-actions">${actionsHtml}</div>
      </div>`;
  }).join("");
}

// ---- Actions -------------------------------------------------------------

async function acceptTask(taskId, btnEl) {
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="spinner"></span>处理中...';
  try {
    await apiPost(`/v1/tasks/${taskId}/accept`, {});
    showToast("🔥 火瞳: 已接单，请尽快完成清台", "ok");
    doneTodayCount += 0; // count on submit
    await fetchTasks();
  } catch (e) {
    showToast("接单失败: " + e.message, "err");
    btnEl.disabled = false;
    btnEl.textContent = "接 单";
  }
}

async function completeTask(taskId, btnEl) {
  btnEl.disabled = true;
  btnEl.innerHTML = '<span class="spinner"></span>提交中...';
  try {
    await apiPost(`/v1/tasks/${taskId}/submit`, { detail: "移动端H5完成清台" });
    showToast("🔥 火瞳: ✅ 清台任务已完成!", "ok");
    doneTodayCount++;
    await fetchTasks();
  } catch (e) {
    showToast("提交失败: " + e.message, "err");
    btnEl.disabled = false;
    btnEl.textContent = "完 成";
  }
}

function openCorrectTask(taskId, tableId) {
  currentCorrectTask = taskId;
  selectedCorrectState = null;
  document.getElementById("correct-table-id").textContent = tableId || taskId;
  document.querySelectorAll("#correct-options .sheet-option").forEach(o => o.classList.remove("selected"));
  document.getElementById("correct-overlay").classList.add("show");
  document.getElementById("correct-sheet").classList.add("show");
}

function openCorrectSheet(taskId, tableId) {
  openCorrectTask(taskId, tableId);
}

function closeCorrectSheet() {
  document.getElementById("correct-overlay").classList.remove("show");
  document.getElementById("correct-sheet").classList.remove("show");
  currentCorrectTask = null;
  selectedCorrectState = null;
}

async function submitCorrection() {
  if (!currentCorrectTask) return;
  if (!selectedCorrectState) {
    showToast("请先选择正确的桌态", "err");
    return;
  }

  const btn = document.getElementById("btn-submit-correct");
  btn.disabled = true;
  btn.textContent = "提交中...";

  try {
    // Post correction event to Hub audit trail
    await apiPost("/v1/tasks/ingest", {
      store_id: auth.storeId || "store_jiaojiang",
      event: {
        event_id: `correction_${currentCorrectTask}_${Date.now()}`,
        event_type: "table_state_correction",
        level: "info",
        message: `桌态纠正: ${document.getElementById("correct-table-id").textContent} → ${selectedCorrectState}`,
        table_id: document.getElementById("correct-table-id").textContent,
        source: "mobile_h5",
        metadata: {
          original_task_id: currentCorrectTask,
          corrected_state: selectedCorrectState,
          corrected_by: auth.username || auth.name,
          auto_detected: false,
        },
      },
    });
    showToast("🔥 火瞳: 纠正已提交，感谢反馈!", "ok");
    closeCorrectSheet();
    await fetchTasks();
  } catch (e) {
    showToast("提交失败: " + e.message, "err");
    btn.disabled = false;
    btn.textContent = "提交纠正";
  }
}

// ---- UI helpers ----------------------------------------------------------

let toastTimer = null;
function showToast(msg, type = "") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

function updateConnStatus(online) {
  // Could add visual indicator in header
}

let refreshCountdown = 5;
function manualRefresh() {
  refreshCountdown = 5;
  fetchTasks();
}

// ---- Auto-refresh loop ---------------------------------------------------
async function refreshLoop() {
  await fetchTasks();
  refreshCountdown = 5;
}
setInterval(() => {
  refreshCountdown--;
  if (refreshCountdown <= 0) {
    refreshLoop();
  }
  document.getElementById("refresh-timer").textContent = refreshCountdown + "s";
}, 1000);

// Initial load
refreshLoop();
</script>
</body>
</html>
